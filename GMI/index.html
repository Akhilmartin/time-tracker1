<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Team Daily Work Tracker</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1d2330;--mut:#6b7385;--bd:#e3e6ec;--ac:#3b6cf6;--ac2:#eaf0ff;--ok:#1f9d57;--wr:#d98a00;--bl:#d6443a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151c;--card:#1b202b;--tx:#e9ecf3;--mut:#9199ad;--bd:#2a3140;--ac:#6f93ff;--ac2:#232c45}}
:root[data-theme="dark"]{--bg:#12151c;--card:#1b202b;--tx:#e9ecf3;--mut:#9199ad;--bd:#2a3140;--ac:#6f93ff;--ac2:#232c45}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:16px}
h1{font-size:21px;margin:0}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
.card h2{font-size:14px;margin:0 0 10px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
input,select,textarea,button{font:inherit;color:var(--tx)}
input,select,textarea{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;width:100%}
textarea{resize:vertical;min-height:54px}
label{font-size:12px;color:var(--mut);display:block;margin-bottom:3px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.full{grid-column:1/-1}
button{cursor:pointer;border:1px solid var(--bd);background:var(--card);border-radius:8px;padding:8px 14px}
button.p{background:var(--ac);border-color:var(--ac);color:#fff}
button.s{padding:4px 9px;font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{border-radius:999px;padding:4px 12px;font-size:13px}
.chip.on{background:var(--ac2);border-color:var(--ac);color:var(--ac)}
.person{margin-top:12px}
.person h3{font-size:15px;margin:0 0 6px;display:flex;justify-content:space-between}
.e{border:1px solid var(--bd);border-radius:10px;padding:10px;margin-bottom:8px;display:flex;gap:10px;justify-content:space-between;align-items:flex-start}
.e b{font-weight:600}
.tag{font-size:12px;border-radius:6px;padding:1px 7px;background:var(--ac2);color:var(--ac);margin-right:6px}
.st{font-size:12px;font-weight:600}
.st.Done{color:var(--ok)}.st.Blocked{color:var(--bl)}.st.Inprogress{color:var(--wr)}.st.Planned{color:var(--mut)}
.mut{color:var(--mut);font-size:13px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:7px 9px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
td.n,th.n{text-align:right}
.banner{background:var(--ac2);border:1px solid var(--ac);border-radius:10px;padding:10px 12px;margin-bottom:14px;font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><h1>📋 Team Daily Work Tracker</h1><div class="mut" id="sub">Loading…</div></div>
    <div class="row">
      <button class="s" id="prev">◀</button>
      <input type="date" id="date" style="width:auto">
      <button class="s" id="next">▶</button>
      <button class="s" id="today">Today</button>
    </div>
  </div>
  <div id="banner"></div>

  <div class="card" id="formCard">
    <h2 id="formTitle">Log your work</h2>
    <div class="grid">
      <div><label>Project</label><input id="project" list="plist" placeholder="Pick or type new"><datalist id="plist"></datalist></div>
      <div><label>Hours</label><input id="hours" type="number" min="0" max="24" step="0.25" placeholder="e.g. 2.5"></div>
      <div><label>Status</label><select id="status"><option>Planned</option><option selected>In progress</option><option>Blocked</option><option>Done</option></select></div>
      <div class="full"><label>What did you work on?</label><input id="task" placeholder="Task / deliverable"></div>
      <div class="full"><label>Notes (optional)</label><textarea id="notes" placeholder="Blockers, links, next steps…"></textarea></div>
    </div>
    <div class="row" style="margin-top:10px">
      <button class="p" id="save">Add entry</button>
      <button id="cancel" style="display:none">Cancel edit</button>
      <span class="mut" id="msg"></span>
    </div>
  </div>

  <div class="card">
    <h2>Entries for <span id="dlabel"></span></h2>
    <div class="row" id="chips"></div>
    <div id="list"></div>
  </div>

  <div class="card">
    <h2>Week summary (hours) · <span id="wlabel"></span></h2>
    <div class="tw" id="week"></div>
  </div>
</div>

<script>
var $=function(i){return document.getElementById(i)};
var iso=function(d){return d.toLocaleDateString('en-CA')};
var state={entries:[],names:{},me:null,db:null,canWrite:true,date:iso(new Date()),filter:'',editing:null};
var asked={};
function esc(s){var d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML}
function nm(id){return (state.names[id]&&state.names[id].name)||'Teammate'}
function addDays(s,n){var d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return iso(d)}
function weekStart(s){var d=new Date(s+'T12:00:00');var k=(d.getDay()+6)%7;d.setDate(d.getDate()-k);return iso(d)}

function render(){
  $('date').value=state.date;
  $('dlabel').textContent=new Date(state.date+'T12:00:00').toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'short',year:'numeric'});
  var projects=[...new Set(state.entries.map(function(e){return e.project}).filter(Boolean))].sort();
  $('plist').innerHTML=projects.map(function(p){return '<option value="'+esc(p)+'">'}).join('');
  var day=state.entries.filter(function(e){return e.date===state.date});
  var dp=[...new Set(day.map(function(e){return e.project}))].sort();
  $('chips').innerHTML='<button class="chip '+(state.filter?'':'on')+'" data-f="">All projects</button>'+
    dp.map(function(p){return '<button class="chip '+(state.filter===p?'on':'')+'" data-f="'+esc(p)+'">'+esc(p)+'</button>'}).join('');
  var shown=day.filter(function(e){return !state.filter||e.project===state.filter});
  var by={};shown.forEach(function(e){(by[e.uid]=by[e.uid]||[]).push(e)});
  var ids=Object.keys(by).sort(function(a,b){return nm(a).localeCompare(nm(b))});
  var h='';
  ids.forEach(function(u){
    var list=by[u].sort(function(a,b){return a.ts-b.ts});
    var tot=list.reduce(function(s,e){return s+(+e.hours||0)},0);
    h+='<div class="person"><h3><span>'+esc(nm(u))+(u===state.me?' (you)':'')+'</span><span class="mut">'+tot+' h</span></h3>';
    list.forEach(function(e){
      var mine=u===state.me;
      h+='<div class="e"><div><span class="tag">'+esc(e.project)+'</span><span class="st '+esc(e.status.replace(' ',''))+'">'+esc(e.status)+'</span> · <span class="mut">'+(+e.hours||0)+' h</span><br><b>'+esc(e.task)+'</b>'+(e.notes?'<div class="mut">'+esc(e.notes)+'</div>':'')+'</div>'+
        (mine&&state.canWrite?'<div class="row"><button class="s" data-edit="'+e.id+'">Edit</button><button class="s" data-del="'+e.id+'">Delete</button></div>':'')+'</div>';
    });
    h+='</div>';
  });
  $('list').innerHTML=h||'<p class="mut">No entries for this day yet.</p>';
  // week summary
  var ws=weekStart(state.date),we=addDays(ws,6);
  $('wlabel').textContent=ws+' → '+we;
  var wk=state.entries.filter(function(e){return e.date>=ws&&e.date<=we});
  var wp=[...new Set(wk.map(function(e){return e.project}))].sort();
  var wu=[...new Set(wk.map(function(e){return e.uid}))].sort(function(a,b){return nm(a).localeCompare(nm(b))});
  if(!wk.length){$('week').innerHTML='<p class="mut">Nothing logged this week.</p>'}
  else{
    var t='<table><tr><th>Person</th>'+wp.map(function(p){return '<th class="n">'+esc(p)+'</th>'}).join('')+'<th class="n">Total</th></tr>';
    var col={};
    wu.forEach(function(u){
      var tot=0;t+='<tr><td>'+esc(nm(u))+'</td>';
      wp.forEach(function(p){var s=wk.filter(function(e){return e.uid===u&&e.project===p}).reduce(function(a,e){return a+(+e.hours||0)},0);tot+=s;col[p]=(col[p]||0)+s;t+='<td class="n">'+(s||'–')+'</td>'});
      t+='<td class="n"><b>'+tot+'</b></td></tr>';
    });
    var g=0;t+='<tr><th>Total</th>'+wp.map(function(p){g+=col[p];return '<th class="n">'+col[p]+'</th>'}).join('')+'<th class="n">'+g+'</th></tr></table>';
    $('week').innerHTML=t;
  }
  $('sub').textContent=state.entries.length+' entries logged · live-synced across your team';
  $('formCard').style.display=state.canWrite?'':'none';
  // resolve names once per new id
  if(state.user){
    var need=[...new Set(state.entries.map(function(e){return e.uid}))].filter(function(i){return i&&!asked[i]});
    if(need.length){need.forEach(function(i){asked[i]=1});
      state.user.profiles(need).then(function(ps){Object.assign(state.names,ps);render()}).catch(function(){})}
  }
}

function resetForm(){
  state.editing=null;$('task').value='';$('notes').value='';$('hours').value='';$('status').value='In progress';
  $('save').textContent='Add entry';$('cancel').style.display='none';$('formTitle').textContent='Log your work';
}
function say(t){$('msg').textContent=t;setTimeout(function(){$('msg').textContent=''},3000)}

$('save').onclick=function(){
  if(!state.db||!state.me){say('Sign in to save entries.');return}
  var project=$('project').value.trim(),task=$('task').value.trim();
  if(!project||!task){say('Project and task are required.');return}
  var existing=state.editing&&state.entries.find(function(e){return e.id===state.editing});
  var body={date:existing?existing.date:state.date,uid:state.me,project:project,task:task,hours:parseFloat($('hours').value)||0,
    status:$('status').value,notes:$('notes').value.trim(),ts:existing?existing.ts:Date.now()};
  var ref=state.db.collection('entries').doc(existing?existing.id:undefined);
  $('save').disabled=true;
  ref.set(body).then(function(){say(existing?'Updated ✓':'Added ✓');resetForm()})
    .catch(function(){say('Could not save — you may only have view access.')})
    .then(function(){$('save').disabled=false});
};
$('cancel').onclick=resetForm;
$('list').onclick=function(ev){
  var b=ev.target.closest('button');if(!b)return;
  if(b.dataset.edit){
    var e=state.entries.find(function(x){return x.id===b.dataset.edit});if(!e)return;
    state.editing=e.id;$('project').value=e.project;$('task').value=e.task;$('hours').value=e.hours;$('status').value=e.status;$('notes').value=e.notes||'';
    $('save').textContent='Save changes';$('cancel').style.display='';$('formTitle').textContent='Edit entry';
    $('formCard').scrollIntoView({behavior:'smooth'});
  }else if(b.dataset.del){
    if(state.db)state.db.collection('entries').doc(b.dataset.del).delete().catch(function(){say('Delete failed.')});
  }
};
$('chips').onclick=function(ev){var b=ev.target.closest('button');if(!b)return;state.filter=b.dataset.f;render()};
$('date').onchange=function(){if(this.value){state.date=this.value;state.filter='';render()}};
$('prev').onclick=function(){state.date=addDays(state.date,-1);state.filter='';render()};
$('next').onclick=function(){state.date=addDays(state.date,1);state.filter='';render()};
$('today').onclick=function(){state.date=iso(new Date());state.filter='';render()};

render();
(async function(){
  try{
    if(!window.claude){throw 0}
    var db=await claude.use('db'),user=await claude.use('user');
    if(!db){$('banner').innerHTML='<div class="banner">Shared tracking needs you to be signed in to Claude and to have access to this page. Ask the page owner to share it with you as a <b>Contributor</b>.</div>';return}
    state.db=db;state.user=user;
    if(user){state.me=await user.id();var cw=await user.can('data.write');state.canWrite=cw!==false}
    db.collection('entries').limit(1000).onSnapshot(function(s){
      state.entries=s.docs.map(function(d){var o=Object.assign({},d.data());o.id=d.id;return o});render();
    },function(){$('banner').innerHTML='<div class="banner">Could not load shared data.</div>'});
  }catch(e){$('banner').innerHTML='<div class="banner">Open this page from its Claude link to enable live team tracking.</div>'}
})();
</script>
</body>
</html>
